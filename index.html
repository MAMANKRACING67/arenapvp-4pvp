<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PvP Arena Complex - Mobile & PC Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; touch-action: none; }
    
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #121216; }

    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .interactive { pointer-events: auto; }

    /* Overlay Screen / Menu */
    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 12, 0.95); display: flex; flex-direction: column;
      justify-content: flex-start; align-items: center; gap: 15px; z-index: 10;
      backdrop-filter: blur(8px); overflow-y: auto; padding: 20px 10px;
    }

    .dashboard { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 1100px; width: 100%; }
    
    .card { 
      background: #18181c; padding: 15px; border-radius: 12px; border: 1px solid #2a2a32; 
      flex: 1; min-width: 280px; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 8px; text-align: left;
    }
    
    .card h3 { color: #7f5af0; border-bottom: 1px solid #2a2a32; padding-bottom: 6px; font-size: 16px; }

    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 14px; font-weight: bold; }
    input, select { background: #0f0f12; color: #fff; border: 1px solid #2a2a32; }
    
    button { background: #7f5af0; color: #fff; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
    button:active, button:hover { background: #6b46c1; transform: scale(0.98); }
    .btn-green { background: #2cb67d; }
    .btn-green:active, .btn-green:hover { background: #249666; }

    /* HUD In-Game */
    #hud { 
      position: absolute; top: 10px; left: 10px; right: 10px; 
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; pointer-events: none; z-index: 5;
    }
    .hud-box { background: rgba(24, 24, 28, 0.85); padding: 8px 14px; border-radius: 8px; border: 1px solid #2a2a32; }
    .coin-val { color: #ffd700; }

    /* MOBILE VIRTUAL CONTROLS */
    #mobile-controls {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 6; display: none;
    }
    
    /* D-PAD VIRTUAL */
    .dpad {
      position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px;
      pointer-events: auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px;
    }
    .dbtn {
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px; display: flex; justify-content: center; align-items: center;
      font-size: 18px; font-weight: bold; color: #fff; active { background: rgba(127, 90, 240, 0.6); }
    }
    .dbtn:active { background: rgba(127, 90, 240, 0.6); }

    /* ACTION BUTTONS (ATTACK & SKILL) */
    .action-btns {
      position: absolute; bottom: 30px; right: 20px; display: flex; gap: 15px; pointer-events: auto;
    }
    .act-btn {
      width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
      display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #btn-attack { background: rgba(255, 84, 112, 0.7); }
    #btn-attack:active { background: rgba(255, 84, 112, 1); }
    #btn-skill { background: rgba(127, 90, 240, 0.7); }
    #btn-skill:active { background: rgba(127, 90, 240, 1); }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <!-- HUD IN-GAME -->
    <div id="hud">
      <div class="hud-box">Koin: <span id="hud-coins" class="coin-val">0</span> 💰</div>
      <div class="hud-box">Status: <span id="hud-status" style="color:#2cb67d;">Lobby</span></div>
    </div>

    <!-- MOBILE VIRTUAL CONTROLS -->
    <div id="mobile-controls">
      <div class="dpad">
        <div></div>
        <div class="dbtn" id="btn-up">▲</div>
        <div></div>
        <div class="dbtn" id="btn-left">◄</div>
        <div></div>
        <div class="dbtn" id="btn-right">►</div>
        <div></div>
        <div class="dbtn" id="btn-down">▼</div>
        <div></div>
      </div>
      <div class="action-btns">
        <div class="act-btn" id="btn-attack">SERANG</div>
        <div class="act-btn" id="btn-skill">SKILL</div>
      </div>
    </div>

    <!-- MENU UTAMA / LOBBY -->
    <div id="menu-overlay" class="interactive">
      <h1 style="color:#7f5af0; font-size: 28px; text-align:center;">PVP ARENA MOBILE</h1>
      
      <div class="dashboard">
        <!-- 1. KONEKSI -->
        <div class="card">
          <h3>1. Mabar Lokal (Wi-Fi)</h3>
          <button class="btn-green" onclick="hostRoom()">Buat Room (Host)</button>
          <input type="text" id="join-code" placeholder="Masukkan Kode Host">
          <button onclick="joinRoom()">Gabung Room</button>
        </div>

        <!-- 2. GACHA -->
        <div class="card">
          <h3>2. Toko Gacha (100 Koin)</h3>
          <p>Koin: <span id="menu-coins" class="coin-val">0</span> 💰</p>
          <button class="btn-green" onclick="spinGacha()">Putar Gacha</button>
          <div id="gacha-res" style="font-size: 11px; color: #2cb67d; background:#0f0f12; padding:6px; border-radius:4px;">-</div>
        </div>

        <!-- 3. LOADOUT -->
        <div class="card">
          <h3>3. Equipment</h3>
          <select id="sel-weapon" onchange="updateItemDesc()"></select>
          <select id="sel-armor" onchange="updateItemDesc()"></select>
          <select id="sel-skill" onchange="updateItemDesc()"></select>
          <div id="item-desc" style="font-size: 11px; color: #7f5af0; background: #0f0f12; padding: 6px; border-radius:4px;">-</div>
          <button class="btn-green" onclick="startGame()">MASUK ARENA</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DETEKSI DEVICE MOBILE
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;

    // AUDIO SYNTHESIZER
    class SoundManager {
      constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      play(freq, type, duration) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      hit() { this.play(120, 'sawtooth', 0.15); }
      shoot() { this.play(500, 'square', 0.2); }
      skill() { this.play(400, 'sine', 0.25); }
      kill() { this.play(600, 'triangle', 0.4); }
    }
    const sound = new SoundManager();

    // ITEM DATA
    const WEAPONS = {
      "Pedang": { name: "Pedang Kayu", type: "melee", damage: 15, range: 60, cd: 350 },
      "Katana": { name: "Katana Iblis", type: "melee", damage: 25, range: 75, cd: 250 },
      "Tombak": { name: "Tombak Naga", type: "melee", damage: 35, range: 110, cd: 600 },
      "Sihir": { name: "Tongkat Api", type: "ranged", damage: 20, speed: 10, cd: 400 },
      "Panah": { name: "Busur Angin", type: "ranged", damage: 14, speed: 16, cd: 200 }
    };
    const ARMORS = {
      "Basic": { name: "Baju Kain", hp: 0, speedBonus: 0 },
      "Besi": { name: "Armor Besi", hp: 50, speedBonus: -0.5 },
      "Emas": { name: "Armor Emas", hp: 100, speedBonus: -1 },
      "Bayangan": { name: "Jubah Bayangan", hp: 25, speedBonus: 2 }
    };
    const SKILLS = {
      "Dash": { name: "Sprint Dash", cd: 3000 },
      "Heal": { name: "Pulih Darah", cd: 6000 },
      "Nuke": { name: "Ledakan Area", cd: 8000 }
    };

    let inventory = { weapons: ["Pedang"], armors: ["Basic"], skills: ["Dash"] };
    let coins = 0, myId = null, isHost = false, inGame = false;

    // CANVAS RESPONSIVE SETUP
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameState = { players: {}, projectiles: [], particles: [] };
    let keys = {};

    // KEYBOARD CONTROLS (PC)
    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    // TOUCH CONTROLS (MOBILE)
    function setupTouchBtn(id, keyName) {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
    }
    setupTouchBtn("btn-up", "w");
    setupTouchBtn("btn-down", "s");
    setupTouchBtn("btn-left", "a");
    setupTouchBtn("btn-right", "d");
    setupTouchBtn("btn-attack", "j");
    setupTouchBtn("btn-skill", " ");

    function initLoadoutUI() {
      const fillSelect = (id, list, data) => {
        const el = document.getElementById(id);
        el.innerHTML = "";
        list.forEach(k => {
          let opt = document.createElement("option"); opt.value = k; opt.innerText = data[k].name;
          el.appendChild(opt);
        });
      };
      fillSelect("sel-weapon", inventory.weapons, WEAPONS);
      fillSelect("sel-armor", inventory.armors, ARMORS);
      fillSelect("sel-skill", inventory.skills, SKILLS);
      updateItemDesc();
    }

    function updateItemDesc() {
      let w = WEAPONS[document.getElementById("sel-weapon").value];
      let a = ARMORS[document.getElementById("sel-armor").value];
      let s = SKILLS[document.getElementById("sel-skill").value];
      document.getElementById("item-desc").innerText = `${w.name} | ${a.name} | ${s.name}`;
    }

    function addCoins(amount) {
      coins += amount;
      document.getElementById("hud-coins").innerText = coins;
      document.getElementById("menu-coins").innerText = coins;
    }

    function spinGacha() {
      if (coins < 100) return alert("Koin tidak cukup!");
      coins -= 100; addCoins(0);

      const pool = [
        { cat: "weapons", key: "Katana", data: WEAPONS },
        { cat: "weapons", key: "Tombak", data: WEAPONS },
        { cat: "weapons", key: "Sihir", data: WEAPONS },
        { cat: "armors", key: "Besi", data: ARMORS },
        { cat: "armors", key: "Emas", data: ARMORS },
        { cat: "skills", key: "Heal", data: SKILLS },
        { cat: "skills", key: "Nuke", data: SKILLS }
      ];

      const item = pool[Math.floor(Math.random() * pool.length)];
      if (!inventory[item.cat].includes(item.key)) {
        inventory[item.cat].push(item.key);
        document.getElementById("gacha-res").innerText = `Dapat: ${item.data[item.key].name}!`;
        initLoadoutUI();
      } else {
        addCoins(50);
        document.getElementById("gacha-res").innerText = `Duplikat! +50 Koin Cashback.`;
      }
    }

    // WEBRTC P2P LOKAL
    let rtcPeer = new RTCPeerConnection({ iceServers: [] });
    let dataChannel = null;

    function hostRoom() {
      isHost = true; myId = 0;
      dataChannel = rtcPeer.createDataChannel("game");
      setupChannel(dataChannel);
      rtcPeer.createOffer().then(o => rtcPeer.setLocalDescription(o)).then(() => {
        rtcPeer.onicecandidate = e => {
          if (!e.candidate) {
            prompt("Kode Room Anda (Salin ke Player 2):", btoa(JSON.stringify(rtcPeer.localDescription)));
            const ans = prompt("Masukkan Kode Balasan Player 2:");
            if (ans) rtcPeer.setRemoteDescription(JSON.parse(atob(ans)));
          }
        };
      });
    }

    function joinRoom() {
      isHost = false; myId = 1;
      const code = document.getElementById("join-code").value.trim();
      if (!code) return alert("Masukkan Kode!");
      rtcPeer.setRemoteDescription(JSON.parse(atob(code)));
      rtcPeer.createAnswer().then(a => rtcPeer.setLocalDescription(a)).then(() => {
        rtcPeer.onicecandidate = e => {
          if (!e.candidate) prompt("Kode Balasan (Salin ke Host):", btoa(JSON.stringify(rtcPeer.localDescription)));
        };
      });
      rtcPeer.ondatachannel = e => { dataChannel = e.channel; setupChannel(dataChannel); };
    }

    function setupChannel(channel) {
      channel.onopen = () => document.getElementById("hud-status").innerText = "Terhubung!";
      channel.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (msg.type === "SYNC") gameState = msg.state;
        if (msg.type === "INPUT") handleInput(msg.id, msg.keys);
        if (msg.type === "KILL" && msg.killerId === myId) { addCoins(200); sound.kill(); }
      };
    }

    function startGame() {
      document.getElementById("menu-overlay").style.display = "none";
      if (isMobile) document.getElementById("mobile-controls").style.display = "block";
      inGame = true;

      const wKey = document.getElementById("sel-weapon").value;
      const aKey = document.getElementById("sel-armor").value;
      const sKey = document.getElementById("sel-skill").value;

      gameState.players[myId] = {
        x: myId === 0 ? 100 : canvas.width - 100,
        y: canvas.height / 2,
        hp: 100 + ARMORS[aKey].hp, maxHp: 100 + ARMORS[aKey].hp,
        speed: 5 + ARMORS[aKey].speedBonus,
        weaponKey: wKey, armorKey: aKey, skillKey: sKey,
        color: myId === 0 ? "#7f5af0" : "#2cb67d",
        lastAtt: 0, skillCd: 0, dirX: 1, dirY: 0
      };
      startGameLoop();
    }

    function handleInput(id, pKeys) {
      let p = gameState.players[id];
      if (!p || p.hp <= 0) return;

      let dx = 0, dy = 0;
      if (pKeys["a"] || pKeys["arrowleft"]) dx -= 1;
      if (pKeys["d"] || pKeys["arrowright"]) dx += 1;
      if (pKeys["w"] || pKeys["arrowup"]) dy -= 1;
      if (pKeys["s"] || pKeys["arrowdown"]) dy += 1;

      if (dx !== 0 || dy !== 0) {
        p.x += dx * p.speed; p.y += dy * p.speed;
        p.dirX = dx; p.dirY = dy;
      }

      p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
      p.y = Math.max(20, Math.min(canvas.height - 20, p.y));

      // SKILL (Space)
      if (pKeys[" "] && Date.now() > p.skillCd) {
        p.skillCd = Date.now() + SKILLS[p.skillKey].cd;
        sound.skill();
        if (p.skillKey === "Dash") { p.x += p.dirX * 100; p.y += p.dirY * 100; }
        if (p.skillKey === "Heal") { p.hp = Math.min(p.maxHp, p.hp + 40); }
      }

      // ATTACK (J Key)
      if (pKeys["j"] && Date.now() > p.lastAtt) {
        let w = WEAPONS[p.weaponKey];
        p.lastAtt = Date.now() + w.cd;

        if (w.type === "melee") {
          sound.hit();
          for (let otherId in gameState.players) {
            if (otherId == id) continue;
            let target = gameState.players[otherId];
            if (Math.hypot(p.x - target.x, p.y - target.y) <= w.range) {
              target.hp -= w.damage;
              if (target.hp <= 0) {
                if (id == myId) { addCoins(200); sound.kill(); }
                else if (dataChannel) dataChannel.send(JSON.stringify({ type: "KILL", killerId: parseInt(id) }));
              }
            }
          }
        } else if (w.type === "ranged") {
          sound.shoot();
          gameState.projectiles.push({
            ownerId: id, x: p.x, y: p.y,
            vx: (p.dirX || 1) * w.speed, vy: p.dirY * w.speed,
            damage: w.damage, color: p.color
          });
        }
      }
    }

    function update() {
      if (!inGame) return;
      if (isHost) {
        handleInput(0, keys);
        for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
          let proj = gameState.projectiles[i];
          proj.x += proj.vx; proj.y += proj.vy;
          for (let id in gameState.players) {
            if (id == proj.ownerId) continue;
            let target = gameState.players[id];
            if (target.hp > 0 && Math.hypot(proj.x - target.x, proj.y - target.y) < 20) {
              target.hp -= proj.damage;
              if (target.hp <= 0 && proj.ownerId == myId) addCoins(200);
              gameState.projectiles.splice(i, 1); break;
            }
          }
        }
        if (dataChannel && dataChannel.readyState === "open") {
          dataChannel.send(JSON.stringify({ type: "SYNC", state: gameState }));
        }
      } else if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(JSON.stringify({ type: "INPUT", id: myId, keys: keys }));
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!inGame) return;

      // Draw Projectiles
      gameState.projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
      });

      // Draw Players
      for (let id in gameState.players) {
        let p = gameState.players[id];
        if (p.hp <= 0) continue;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();

        // HP Bar
        ctx.fillStyle = "red"; ctx.fillRect(p.x - 20, p.y - 28, 40, 5);
        ctx.fillStyle = "#2cb67d"; ctx.fillRect(p.x - 20, p.y - 28, (p.hp / p.maxHp) * 40, 5);
      }
    }

    function startGameLoop() {
      setInterval(() => { update(); draw(); }, 1000 / 60);
    }

    initLoadoutUI();
  </script>
</body>
</html>
